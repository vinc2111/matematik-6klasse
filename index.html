/* Layout: plakat og lærebog. Hvert kapitel har sin egen farve og en geometrisk forside; resten er sort tekst på lyst papir med tydelige streger. Kun lyst tema. */
:root{
  --bg:#f6f5f1; --panel:#ffffff; --surface:#ffffff; --fg:#15171c; --muted:#5d6270; --line:#dcd9d0;
  --ink:#2447d6; --on-ink:#ffffff; --soft:#dfe6fb; --m2:#0f8a6a; --m3:#e5432d;
  --ok:#157a47; --ok-soft:#dff3e6; --bad-soft:#fde7e1; --hint-soft:#fff1cc;
  --c:#15171c; --on:#ffffff; --k:#15171c;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:5px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.6;padding-block:20px 90px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));font-variant-numeric:tabular-nums lining-nums}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,.q,.no,.step,.fejl,.num{font-family:var(--display);font-optical-sizing:auto}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-weight:800;letter-spacing:-.03em;line-height:.95}
h2{font-size:1.75rem;font-weight:700;letter-spacing:-.015em;line-height:1.15;margin-bottom:16px;display:flex;align-items:baseline;gap:.55em}
h3{font-size:1.05rem;margin:24px 0 8px}
p{margin:0 0 12px;max-width:60ch;text-wrap:pretty}
ul,ol{margin:0 0 12px;padding-left:1.25em;max-width:60ch}
li{margin-bottom:8px}
a{color:var(--fg)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.small{font-size:.95rem;color:var(--muted)}
.ic{width:1.05em;height:1.05em;flex:none;vertical-align:-.15em}
.step{font-weight:800;color:var(--k)}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-bottom:18px}
.brand{font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:-.01em;color:var(--fg);text-decoration:none}
#nav{color:var(--muted)}
#nav a{display:inline-flex;align-items:center;gap:8px;font-weight:600;text-decoration:none;border-bottom:2px solid var(--fg);padding-bottom:1px}

/* forside */
.hero h1{font-size:clamp(2.5rem,10.6vw,7.2rem);margin-top:14px}
.intro{display:flex;flex-wrap:wrap;gap:22px 56px;justify-content:space-between;align-items:flex-end;margin-top:26px}
.lead{font-size:1.3rem;line-height:1.45;max-width:34ch;margin:0}
.stat{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
.stat .num{font-weight:800;font-size:4rem;line-height:.9;letter-spacing:-.03em}
.stat .lbl{font-size:1rem;line-height:1.3;color:var(--muted)}
.block{margin-top:64px;padding-top:26px;border-top:2px solid var(--fg)}
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 22px;list-style:none;padding:0;margin:8px 0 0;max-width:none}
.shelf li{margin:0}
@media (max-width:900px){.shelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 16px}}
.cover{display:flex;flex-direction:column;gap:6px;color:var(--fg);text-decoration:none}
.art{position:relative;overflow:hidden;background:var(--c);color:var(--on)}
.art svg{position:absolute;inset:0;width:100%;height:100%;display:block}

<div class="wrap">
  <header class="top"><a class="brand" href="#hjem">Matematikværksted</a><span id="nav"></span></header>
  <main id="app"></main>
</div>

<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const f=n=>{n=Math.round(n*100)/100;return (n<0?'−':'')+Math.abs(n).toLocaleString('da-DK',{maximumFractionDigits:2,useGrouping:false})};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const T=(q,a,unit,hint,sol,tol)=>({q,a,unit,hint,sol,tol});
function parse(s){s=s.trim().replace(/\s/g,'').replace(/[−–]/g,'-').replace(/^[a-zæøå]=/i,'').replace(/[^\d]+$/,'');if(s.includes(',')||/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'').replace(',','.');return /^-?\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN}
const PI='Brug π ≈ 3,14.';

/* ---------- Opgaver: tre niveauer pr. kapitel ---------- */
const K={};
K.tal=[[
 ()=>{const a=R(2,9),b=R(2,6),c=R(2,6);return T(`Udregn ${a} + ${b} · ${c}`,a+b*c,'','Gange kommer før plus.',`${b} · ${c} = ${b*c}. Derefter ${a} + ${b*c} = ${a+b*c}.`)},
 ()=>{const a=R(1,8),b=a+R(1,9);return T(`Udregn ${a} − ${b}`,a-b,'',`Tegn en tallinje. Start på ${a}, og hop ${b} til venstre.`,`Fra ${a} er der ${a} hop ned til 0. Så mangler der ${b-a} hop. Du lander på ${f(a-b)}.`)},
 ()=>{const a=R(26,40),b=R(2,5),c=R(2,5);return T(`Udregn ${a} − ${b} · ${c}`,a-b*c,'','Gange kommer før minus.',`${b} · ${c} = ${b*c}. Derefter ${a} − ${b*c} = ${a-b*c}.`)}
],[
 ()=>{const a=R(2,8),b=R(2,8),c=R(2,5),d=R(1,9);return T(`Udregn (${a} + ${b}) · ${c} − ${d}`,(a+b)*c-d,'','Start med parentesen.',`Parentesen først: ${a} + ${b} = ${a+b}. Så gange: ${a+b} · ${c} = ${(a+b)*c}. Til sidst: ${(a+b)*c} − ${d} = ${(a+b)*c-d}.`)},
 ()=>{const a=R(3,12),b=R(1,15);return T(`Udregn −${a} + ${b}`,b-a,'',`Start på −${a} på tallinjen, og hop ${b} til højre.`,`Du starter på −${a} og hopper ${b} til højre. Du lander på ${f(b-a)}.`)},
 ()=>{const a=R(2,12),b=R(2,12);return T(`Udregn −${a} − ${b}`,-a-b,'',`Start på −${a} på tallinjen, og hop ${b} til venstre.`,`Du starter på −${a} og hopper ${b} til venstre. Du lander på ${f(-a-b)}.`)},
 ()=>{const a=R(2,5);return T(`Udregn ${a}³`,a**3,'',`${a}³ betyder ${a} · ${a} · ${a}.`,`${a} · ${a} = ${a*a}, og ${a*a} · ${a} = ${a**3}.`)}
],[
 ()=>{const n=R(3,6),k=R(2,8);return T(`Saft blandes i forholdet 1:${n} (saft til vand). Du bruger ${k} dL saft. Hvor mange dL vand skal du bruge?`,k*n,'dL',`For hver 1 dL saft skal der ${n} dL vand til.`,`${k} · ${n} = ${k*n} dL vand.`)},
 ()=>{const [p,d]=pick([[2,3],[3,4],[1,2],[3,5],[4,5]]),m=R(2,4);return T(`I en klasse er forholdet mellem piger og drenge ${p}:${d}. Der er ${(p+d)*m} elever. Hvor mange piger er der?`,p*m,'piger','Find først, hvor mange dele der er i alt.',`Der er ${p} + ${d} = ${p+d} dele. Hver del er ${(p+d)*m} : ${p+d} = ${m} elever. Pigerne er ${p} dele: ${p} · ${m} = ${p*m}.`)},
 ()=>{const a=R(5,20),b=R(2,5),c=R(3,6),d=R(2,5);return T(`Udregn ${a} − ${b} · ${c} + ${d}²`,a-b*c+d*d,'','Potens først, så gange, til sidst plus og minus fra venstre mod højre.',`${d}² = ${d*d}, og ${b} · ${c} = ${b*c}. Derefter ${a} − ${b*c} + ${d*d} = ${f(a-b*c+d*d)}.`)}
]];
K.cirkler=[[
 ()=>{const r=R(2,15);return T(`En cirkel har radius ${r} cm. Hvad er diameteren?`,2*r,'cm','Diameteren er dobbelt så lang som radius.',`d = 2 · ${r} = ${2*r} cm.`)},
 ()=>{const r=R(2,15);return T(`En cirkel har diameter ${2*r} cm. Hvad er radius?`,r,'cm','Radius er halvdelen af diameteren.',`r = ${2*r} : 2 = ${r} cm.`)},
 ()=>{const d=R(2,20);return T(`En cirkel har diameter ${d} cm. Hvad er omkredsen? ${PI}`,3.14*d,'cm','O = π · d.',`O ≈ 3,14 · ${d} = ${f(3.14*d)} cm.`,3.14*d*.01)}
],[
 ()=>{const r=R(2,12);return T(`En cirkel har radius ${r} cm. Hvad er omkredsen? ${PI}`,6.28*r,'cm','Find diameteren først.',`d = 2 · ${r} = ${2*r} cm. O ≈ 3,14 · ${2*r} = ${f(6.28*r)} cm.`,6.28*r*.01)},
 ()=>{const r=R(2,10);return T(`En cirkel har radius ${r} cm. Hvad er arealet? ${PI}`,3.14*r*r,'cm²','A = π · r · r.',`A ≈ 3,14 · ${r} · ${r} = 3,14 · ${r*r} = ${f(3.14*r*r)} cm².`,3.14*r*r*.01)}
],[
 ()=>{const d=R(5,30);return T(`En cirkel har omkredsen ${f(3.14*d)} cm. Hvad er diameteren? ${PI}`,d,'cm','O = π · d. Hvad skal du gøre for at finde d?',`d = O : π ≈ ${f(3.14*d)} : 3,14 = ${d} cm.`,d*.01)},
 ()=>{const d=pick([50,60,70]),n=pick([10,20,100]);return T(`Et hjul har diameteren ${d} cm. Hvor mange meter ruller det på ${n} omgange? ${PI}`,3.14*d*n/100,'m','Én omgang er lige så lang som hjulets omkreds. Husk at lave cm om til m.',`Omkreds: 3,14 · ${d} = ${f(3.14*d)} cm. ${n} omgange: ${f(3.14*d*n)} cm = ${f(3.14*d*n/100)} m.`,3.14*d*n/100*.01)},
 ()=>{const r=2*R(1,5);return T(`En halvcirkel har radius ${r} cm. Hvad er arealet? ${PI}`,3.14*r*r/2,'cm²','Find arealet af hele cirklen, og halver det.',`Hel cirkel: 3,14 · ${r} · ${r} = ${f(3.14*r*r)} cm². Halvdelen er ${f(3.14*r*r/2)} cm².`,3.14*r*r/2*.01)}
]];
K.handel=[[
 ()=>{const p=pick([10,25,50]),N=40*R(2,20);return T(`Hvad er ${p} % af ${N} kr.?`,N*p/100,'kr.',{10:'10 % er en tiendedel. Divider med 10.',25:'25 % er en fjerdedel. Divider med 4.',50:'50 % er halvdelen.'}[p],`${N} : ${100/p} = ${f(N*p/100)} kr.`)},
 ()=>{const [a,b,p]=pick([[1,2,50],[1,4,25],[3,4,75],[1,5,20],[2,5,40],[1,10,10],[3,10,30]]);return T(`Hvor mange procent er ${a}/${b}?`,p,'%','Forlæng brøken, så nævneren bliver 100.',`${a}/${b} = ${p}/100 = ${p} %.`)}
],[
 ()=>{const p=pick([10,20,25,30,40]),N=20*R(5,40);return T(`En trøje koster ${N} kr. Der er ${p} % rabat. Hvad koster trøjen nu?`,N-N*p/100,'kr.','Find først rabatten i kroner. Start med 10 % eller 25 %.',`Rabatten er ${p} % af ${N} kr. = ${f(N*p/100)} kr. Ny pris: ${N} − ${f(N*p/100)} = ${f(N-N*p/100)} kr.`)},
 ()=>{const p=pick([15,35,60,75]),N=20*R(2,30);return T(`Hvad er ${p} % af ${N} kr.?`,N*p/100,'kr.','Del procenten op, fx i 10 % og 5 %, eller i 50 % og 25 %.',`1 % af ${N} kr. er ${f(N/100)} kr. ${p} · ${f(N/100)} = ${f(N*p/100)} kr.`)}
],[
 ()=>{const N=20*R(2,40);return T(`En vare koster ${N} kr. uden moms. Momsen er 25 %. Hvad er prisen med moms?`,1.25*N,'kr.','Find 25 % af prisen, og læg den til.',`Moms: ${N} : 4 = ${f(N/4)} kr. Pris med moms: ${N} + ${f(N/4)} = ${f(1.25*N)} kr.`)},
 ()=>{const p=pick([20,25,50]),N=100*R(2,12),S=N*(100-p)/100;return T(`En jakke koster ${S} kr. efter ${p} % rabat. Hvad kostede den før rabatten?`,N,'kr.',`Efter ${p} % rabat betaler du ${100-p} % af prisen.`,`${S} kr. er ${100-p} % af prisen. 1 % er ${S} : ${100-p} = ${f(S/(100-p))} kr. Hele prisen er 100 · ${f(S/(100-p))} = ${N} kr.`)},
 ()=>{const [a,b,p]=pick([[12,48,25],[15,60,25],[9,45,20],[18,24,75],[14,35,40],[27,90,30],[33,55,60]]);return T(`${a} ud af ${b} elever cykler i skole. Hvor mange procent er det?`,p,'%','Skriv det som en brøk, og forkort den.',`${a}/${b} = ${a/gcd(a,b)}/${b/gcd(a,b)} = ${p}/100 = ${p} %.`)}

const total=id=>got(id,0)+got(id,1)+got(id,2)+got(id,3);
const sl=(id,lab,min,max,v,step=1)=>`<label class="sl" for="${id}"><span>${lab}: <b id="${id}-o"></b></span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${v}"></label>`;
const pts=a=>a.map(p=>p.map(v=>Math.round(v*10)/10).join(',')).join(' ');

function mount(root,vb,ctl,draw){
  root.innerHTML=`<div class="tool"><div class="fig"><svg id="fig" viewBox="${vb}" role="img" aria-label="Interaktiv model. Tallene står i teksten ved siden af."></svg></div><div class="ctl"><div class="ctls" id="ctls">${ctl}</div><div class="read" id="read"></div></div></div>`;
  const go=()=>{root.querySelectorAll('input[type=range]').forEach(i=>{const o=$(i.id+'-o');if(o)o.textContent=f(+i.value)});const r=draw();$('fig').innerHTML=r[0];$('read').innerHTML=r[1]};
  $('ctls').addEventListener('input',go);go();return go;
}

  const a=Math.round(Math.atan2(h,t)*180/Math.PI),b=Math.round(Math.atan2(h,gl-t)*180/Math.PI),c=180-a-b,ret=t==0||t==gl||t*(t-gl)+h*h==0,mx=Math.max(a,b,c);

data(root){let mode=1,cnt=[];const reset=()=>{cnt=Array(mode==1?6:11).fill(0)};reset();
  const go=mount(root,'0 0 460 260',`<div class="row"><button class="btn ghost" id="d-m1" aria-pressed="true">Én terning</button><button class="btn ghost" id="d-m2" aria-pressed="false">Summen af to terninger</button></div><div class="row"><button class="btn" data-n="1">Slå 1 gang</button><button class="btn" data-n="10">Slå 10</button><button class="btn" data-n="100">Slå 100</button><button class="btn" data-n="1000">Slå 1000</button><button class="btn ghost" id="d-r">Nulstil</button></div>`,()=>{
    const k=cnt.length,n=cnt.reduce((a,b)=>a+b,0),ex=cnt.map((_,i)=>mode==1?1/6:(6-Math.abs(i-5))/36),sh=cnt.map(c=>n?c/n:0),top=Math.max(...sh,...ex)*1.25,slot=420/k;
    let g=`<line class="ax" x1="15" x2="445" y1="215" y2="215"/>`;
    for(let i=0;i<k;i++){const x=20+i*slot,hh=sh[i]/top*180,ye=215-ex[i]/top*180;
      g+=`<rect class="f-ink" x="${x+slot*.2}" y="${215-hh}" width="${slot*.6}" height="${hh}"/><line class="s-m3 dash" x1="${x+slot*.05}" x2="${x+slot*.95}" y1="${ye}" y2="${ye}"/><text x="${x+slot/2}" y="236" text-anchor="middle" font-size="17" font-weight="700">${i+(mode==1?1:2)}</text>`;
      if(n)g+=`<text class="mu" x="${x+slot/2}" y="252" text-anchor="middle" font-size="13">${Math.round(sh[i]*100)} %</text>`}
    return [g,`<p class="eq">Antal slag: ${n}</p><p><b class="ci">Søjler:</b> dine slag. <b class="c3">Stiplede linjer:</b> det, du kan forvente.</p><p>${mode==1?'Hvert udfald har sandsynligheden 1/6. Det er cirka 16,7 %.':'Summen 7 kan slås på 6 måder ud af 36. Summen 2 kan kun slås på 1 måde.'}</p>`]});
  const setm=m=>{mode=m;reset();$('d-m1').setAttribute('aria-pressed',m==1);$('d-m2').setAttribute('aria-pressed',m==2);go()};
  $('d-m1').onclick=()=>setm(1);$('d-m2').onclick=()=>setm(2);$('d-r').onclick=()=>{reset();go()};
  root.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{for(let i=0;i<+b.dataset.n;i++)cnt[mode==1?R(0,5):R(0,5)+R(0,5)]++;go()})},

algebra(root){let a,b,c,o,steps;const eq=()=>`${a>1?a:''}x${b?` + ${b}`:''} = ${c}`;
  const nyt=()=>{a=R(2,4);const x=R(1,6);b=R(1,8);c=a*x+b;o={a,b,c,x};steps=[]};nyt();
  const go=mount(root,'0 0 460 225',`<div class="row"><button class="btn" id="a-s">Træk 1 fra på begge sider</button><button class="btn" id="a-d">Divider</button><button class="btn ghost" id="a-n">Ny ligning</button></div>`,()=>{
    let g=`<line class="ax" stroke-width="5" x1="30" x2="430" y1="172" y2="172" style="stroke-width:5"/><polygon class="f-m2" points="230,175 207,216 253,216"/>`;
    for(let i=0;i<a;i++)g+=`<rect class="f-soft" x="${40+i*40}" y="134" width="34" height="34" rx="3"/><rect class="s-ink" style="stroke-width:2" x="${40+i*40}" y="134" width="34" height="34" rx="3"/><text x="${57+i*40}" y="157" text-anchor="middle" font-size="17" font-weight="700">x</text>`;
    for(let i=0;i<b;i++)g+=`<circle class="f-m3" cx="${50+i*20}" cy="120" r="8.5"/>`;
    for(let i=0;i<c;i++)g+=`<circle class="f-m3" cx="${262+(i%8)*21}" cy="${160-Math.floor(i/8)*21}" r="8.5"/>`;
    const done=a==1&&b==0;$('a-s').disabled=b==0;$('a-d').disabled=b>0||a==1;$('a-d').textContent=a>1?`Divider begge sider med ${a}`:'Divider';
    return [g,`<p class="eq">${eq()}</p>${steps.length?`<ol class="plain">${steps.map(s=>`<li>${s}</li>`).join('')}</ol>`:''}${done?`<p class="fb" data-s="ok"><b>Løst.</b> x = ${c}. Tjek: ${o.a} · ${c} + ${o.b} = ${o.c}.</p>`:b>0?`<p class="small">Fjern først de løse 1'ere. Bagefter kan du dele.</p>`:`<p class="small">Nu er der kun x-kasser til venstre. Del lige over på begge sider.</p>`}`]});
  $('a-s').onclick=()=>{b--;c--;steps.push(`Træk 1 fra på begge sider: ${eq()}`);go()};
  $('a-d').onclick=()=>{const k=a;c/=a;a=1;steps.push(`Divider begge sider med ${k}: ${eq()}`);go()};
  $('a-n').onclick=()=>{nyt();go()}},

rum(root){let lh=0;mount(root,'0 0 460 300',sl('r1','Længde l',1,6,4)+sl('r2','Bredde b',1,6,3)+sl('r3','Højde h',1,5,2)+sl('r4','Vis antal lag',1,5,2),()=>{
  const l=val('r1'),b=val('r2'),h=val('r3'),e=$('r4');e.max=h;if(lh!=h||+e.value>h){e.value=h;lh=h}const lag=+e.value;$('r4-o').textContent=lag;
  const u=24,cw=u*.866,ox=230+(b-l)*cw/2,oy=150+(h*u-(l+b)*u/2)/2,P=(i,j,k)=>[ox+(i-j)*cw,oy+(i+j)*u/2-k*u];let g='';
  for(let i=0;i<l;i++)for(let j=0;j<b;j++)for(let k=0;k<lag;k++){
    g+=`<polygon class="cube c1" points="${pts([P(i,j,k+1),P(i+1,j,k+1),P(i+1,j+1,k+1),P(i,j+1,k+1)])}"/><polygon class="cube c2" points="${pts([P(i,j+1,k),P(i+1,j+1,k),P(i+1,j+1,k+1),P(i,j+1,k+1)])}"/><polygon class="cube c3" points="${pts([P(i+1,j,k),P(i+1,j+1,k),P(i+1,j+1,k+1),P(i+1,j,k+1)])}"/>`}
  return [g,`<p>Ét lag: ${l} · ${b} = ${l*b} terninger</p><p>Antal lag: ${h}${lag<h?`. Du ser ${lag} lag med ${l*b*lag} terninger.`:''}</p><p class="eq">V = ${l} · ${b} · ${h} = ${l*b*h} cm³</p><p>Overflade af hele kassen: 2 · (${l*b} + ${l*h} + ${b*h}) = ${2*(l*b+l*h+b*h)} cm²</p>${lag<h?`<p class="small">Rumfang og overflade gælder hele kassen med ${h} lag, også når du kun ser ${lag}.</p>`:''}`]})},

monstre(root){const M=[
  {navn:'L-figur',cnt:n=>2*n+1,regel:'2 · n + 1',hv:'Hjørnebrikken er der altid. Hver arm har n brikker, og der er 2 arme.',cells:n=>{const c=[[0,0,0]];for(let i=1;i<=n;i++)c.push([0,-i,1],[i,0,1]);return c}},
  {navn:'Kryds',cnt:n=>4*n+1,regel:'4 · n + 1',hv:'Midterbrikken er der altid. Der er 4 arme med n brikker i hver.',cells:n=>{const c=[[0,0,0]];for(let i=1;i<=n;i++)c.push([0,-i,1],[i,0,1],[0,i,1],[-i,0,1]);return c}},
  {navn:'Ramme',cnt:n=>4*n+4,regel:'4 · n + 4',hv:'De 4 hjørner er der altid. Hver af de 4 sider har n brikker.',cells:n=>{const c=[[0,0,0],[n+1,0,0],[0,n+1,0],[n+1,n+1,0]];for(let i=1;i<=n;i++)c.push([i,0,1],[i,n+1,1],[0,i,1],[n+1,i,1]);return c}},
  {navn:'Trappe',cnt:n=>n*(n+1)/2,regel:'n · (n + 1) : 2',hv:'To ens trapper kan sættes sammen til et rektangel med n rækker og n + 1 brikker i hver række. Trappen er halvdelen.',cells:n=>{const c=[];for(let r=1;r<=n;r++)for(let k=1;k<=r;k++)c.push([k,r,1]);return c}}];
  mount(root,'0 0 460 280',`<label class="sl" for="m1"><span>Mønster</span><select id="m1">${M.map((m,i)=>`<option value="${i}">${m.navn}</option>`).join('')}</select></label>`+sl('m2','Figurnummer n',1,6,3),()=>{

};

 data:A(`<rect opacity=".5" x="22" y="172" width="32" height="52"/><rect opacity=".5" x="66" y="120" width="32" height="104"/><rect x="110" y="74" width="32" height="150"/><rect opacity=".5" x="154" y="128" width="32" height="96"/><rect opacity=".5" x="198" y="164" width="32" height="60"/><g transform="rotate(14 192 60)"><rect ${SH} x="152" y="20" width="80" height="80" rx="13"/>${[[172,40],[212,40],[192,60],[172,80],[212,80]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="7.5"/>`).join('')}</g>`),
 algebra:A(`<circle ${SH} cx="196" cy="196" r="88"/><path ${L} style="stroke-width:25;stroke-linecap:butt" d="M38 86L122 198M122 86L38 198"/><rect x="150" y="114" width="72" height="23"/><rect x="150" y="158" width="72" height="23"/>`),
 rum:A(`<path d="M120 46L194 88L120 130L46 88Z"/><path opacity=".5" d="M46 88L120 130V216L46 174Z"/><path ${SH} d="M194 88L120 130V216L194 174Z"/>`),
 monstre:A([0,1,2,3,4,5].map(i=>[...Array(i+1)].map((_,j)=>`<rect${j==i?'':' opacity=".45"'} x="${14+36*i}" y="${196-36*j}" width="30" height="30"/>`).join('')).join(''))};
const pip=(id,l)=>`<span class="pips">${[0,1,2,3,4].map(i=>`<i${i<got(id,l)?' class="on"':''}></i>`).join('')}</span>`;
const meter=id=>`<span class="meter">${[0,1,2,3].map(l=>`<i style="--p:${got(id,l)*20}%"></i>`).join('')}</span>`;
function practice(ch){let lv=0,task,tries,done,streak=0;
  const fb=(s,h)=>{const e=$('fb');e.hidden=false;e.dataset.s=s;e.innerHTML=h};
  const navn=l=>l<3?'niveau '+(l+1):'problemerne';
  const dots=()=>{const n=got(ch.id,lv),t=total(ch.id);
    $('lvs').querySelectorAll('button').forEach((b,i)=>{b.setAttribute('aria-pressed',i==lv);b.querySelector('.pp').innerHTML=pip(ch.id,i)});
    $('chprog').innerHTML=meter(ch.id)+`<span>${t==20?'Hele kapitlet er klaret':t+' af 20 opgaver klaret'}</span>`;
    $('sideprog').innerHTML=LV.map((t,i)=>`<p><span>${t}</span>${pip(ch.id,i)}</p>`).join('');
    const up=[0,1,2,3].find(l=>l>lv&&got(ch.id,l)<5);
    $('dots').innerHTML=n<5?`${n} af 5 rigtige ${lv<3?'på':'i'} ${navn(lv)}. Fem rigtige klarer ${lv<3?'niveauet':'problemerne'}.`:`<b>Så er ${navn(lv)} klaret.</b> ${t==20?'Du har klaret hele kapitlet!':up!=null?`<button type="button" class="link" id="up">Gå videre til ${navn(up)}</button>`:''}`;
    const u=$('up');if(u)u.onclick=()=>{lv=up;task=null;ny();$('ans').focus()}};
  const ny=()=>{let t;do{t=pick(ch.tasks[lv])()}while(task&&t.q==task.q);task=t;tries=0;done=false;$('q').textContent=task.q;$('tip').hidden=lv!=3;$('ans').value='';$('unit').textContent=task.unit;$('fb').hidden=true;$('chk').disabled=false;$('hnt').hidden=false;$('nxt').className='btn ghost';$('nxt').textContent='Ny opgave';dots()};
  const slut=()=>{done=true;$('chk').disabled=true;$('hnt').hidden=true;$('nxt').className='btn';$('nxt').textContent='Næste opgave';$('nxt').focus()};
  $('lvs').innerHTML=LV.map((t,i)=>`<button type="button" data-l="${i}">${t}<span class="pp"></span></button>`).join('');
  $('lvs').querySelectorAll('button').forEach(b=>b.onclick=()=>{lv=+b.dataset.l;task=null;ny()});
  $('pf').addEventListener('submit',e=>{e.preventDefault();if(done)return;const v=parse($('ans').value);
    if(isNaN(v))return fb('hint','Skriv svaret som et tal, fx 12 eller 3,5.');
    if(Math.abs(v-task.a)<=(task.tol||0)+0.011){slut();streak++;const p=prog[ch.id]=prog[ch.id]||[0,0,0,0];p[lv]=Math.min(5,(p[lv]||0)+1);save();dots();fb('ok',`<b>Rigtigt.${streak>=3?` ${streak} i træk!`:''}</b> ${task.sol}`)}
    else{tries++;streak=0;if(tries==1)fb('no','Ikke helt endnu. Kig din udregning igennem, og prøv igen.');else if(tries==2)fb('hint',`<b>Hint:</b> ${task.hint}`);else{slut();fb('no',`<b>Svaret er ${(f(task.a)+' '+task.unit).trim()}.</b> ${task.sol} Tag en ny af samme slags, så sidder den.`)}}});
  $('hnt').onclick=()=>fb('hint',`<b>Hint:</b> ${task.hint}`);$('nxt').onclick=()=>{ny();$('ans').focus()};ny()}

/* ---------- Sider ---------- */
const HOW={tal:'Træk i de to skydere, og se, hvor du lander på tallinjen.',cirkler:'Træk i skyderen, og se, hvad der sker med omkredsen.',handel:'Træk i skyderne, og find ud af, hvad procenten svarer til i kroner.',figurer:'Træk i skyderne, og hold øje med arealet og vinklerne.',data:'Tryk på knapperne for at slå med terningerne.',algebra:'Tryk på knapperne, til x står alene på vægten.',rum:'Træk i skyderne, og byg kassen lag for lag.',monstre:'Vælg et mønster, og træk i skyderen for at se figuren vokse.'};
const STEPS=[['s-prov','Prøv selv'],['s-ord','Ord, du skal kende'],['s-eks','Eksempel'],['s-fejl','Find fejlen'],['s-opg','Opgaver'],['s-fork','Forklar til din makker'],['s-kan','Kan du nu?']];
let kan={},spy;try{kan=JSON.parse(localStorage.getItem('mv6kan')||'{}')||{}}catch(e){}
function nav(c){$('nav').innerHTML=c?`<a href="#hjem">${IC.l}Alle kapitler</a>`:'6. klasse'}
function home(){nav();const app=$('app');app.style.cssText='';const all=CH.reduce((a,c)=>a+total(c.id),0);let last;try{last=CH.find(c=>c.id==localStorage.getItem('mv6last'))}catch(e){}
const go=last&&total(last.id)<20?last:CH.find(c=>total(c.id)<20);
app.innerHTML=`
<div class="hero"><h1>Matematik&shy;værksted</h1>
<div class="intro"><p class="lead">${all?'Godt i gang. Fortsæt, hvor du slap, eller vælg et andet kapitel.':'Her øver du det, vi arbejder med i matematik i 6. klasse. Vælg et kapitel.'}</p>
${all?`<div class="stat"><span class="num">${all}</span><span class="lbl">af 160 opgaver<br>${all==160?'Alle er klaret!':'er klaret'}</span>${go?`<a class="btn" href="#${go.id}">Fortsæt med ${go.t}${IC.r}</a>`:''}</div>`:''}</div></div>
<section class="block"><h2>Kapitler</h2>
<ol class="shelf">${CH.map(c=>{const t=total(c.id);return `<li><a class="cover" style="${hue(c.id)}" href="#${c.id}"><span class="art"><span class="no">${c.n}</span>${ART[c.id]}</span><b>${c.t}</b><span class="d">${c.d}</span><span class="prog">${meter(c.id)}<span class="cnt${t==20?' all':''}">${t==20?IC.ok+'klaret':t+' af 20'}</span></span></a></li>`}).join('')}</ol></section>
<section class="block"><h2>Sådan gør du</h2>
<ol class="how"><li>Prøv figuren, og læs eksemplet.</li><li>Regn opgaven i dit hæfte.</li><li>Skriv svaret, og tryk på Tjek svar. Brug et hint, hvis du sidder fast.</li><li>Fem rigtige klarer et niveau. Fire niveauer, og kapitlet er klaret.</li></ol></section>
<p class="small foot">Der kommer nye tal i hver opgave, så du kan altid prøve igen. Siden husker, hvad du har klaret, men kun på den computer, du sidder ved. Kapitlerne følger bogen, KonteXt+ 6.</p>`}
function chapter(c){nav(c);try{localStorage.setItem('mv6last',c.id)}catch(e){}const i=c.n-1,pv=CH[i-1],nx=CH[i+1],app=$('app'),k=kan[c.id]||[];app.style.cssText=hue(c.id);
const H=n=>`<h2><span class="step">${n}</span>${STEPS[n-1][1]}</h2>`;
app.innerHTML=`
<header class="band"><div class="bt"><p class="no">Kapitel ${c.n}</p><h1>${c.t}</h1><p class="lead">${INTRO[c.id]}</p><p class="chprog" id="chprog"></p></div><div class="art">${ART[c.id]}</div></header>
<div class="chap">
<aside class="side"><ol>${STEPS.map(([d,t],n)=>`<li><button type="button" data-go="${d}"><span>${n+1}</span>${t.split(',')[0].replace(' til din makker','')}</button></li>`).join('')}</ol><div class="sideprog" id="sideprog"></div></aside>
<div class="main">
<section id="s-prov">${H(1)}<p>${HOW[c.id]}</p><div id="tool"></div><h3>Læg mærke til</h3><ul>${c.se.map(s=>`<li>${s}</li>`).join('')}</ul></section>
<section id="s-ord">${H(2)}<dl class="ord">${c.ord.map(o=>`<dt>${o[0]}</dt><dd>${o[1]}</dd>`).join('')}</dl></section>
<section id="s-eks">${H(3)}<div class="eks"><p class="eq">${c.eks[0]}</p><ol>${c.eks[1].map(s=>`<li><span>${s}</span></li>`).join('')}</ol></div></section>
<section id="s-fejl">${H(4)}<p class="fejl">${c.fejl[0]}</p><p>Hvad er gået galt? Snak med din makker, før du kigger.</p><details><summary>Se forklaringen</summary><p>${c.fejl[1]}</p></details></section>
<section id="s-opg">${H(5)}<p>Regn i dit hæfte, og skriv svaret her.</p><div class="work"><div class="tabs" id="lvs"></div><p class="q" id="q"></p><p class="small" id="tip" hidden>Tegn eller skriv op, hvad du ved, før du regner.</p><form class="row" id="pf" autocomplete="off"><label for="ans">Svar</label><input class="ans" id="ans" inputmode="text" autocomplete="off"><span id="unit"></span><button class="btn" id="chk">Tjek svar</button></form><p class="row"><button type="button" class="btn ghost" id="hnt">Hint</button><button type="button" class="btn ghost" id="nxt">Ny opgave</button></p><p class="fb" id="fb" role="status" hidden></p><p class="small" id="dots"></p></div></section>
<section id="s-fork">${H(6)}<ul>${c.forklar.map(s=>`<li>${s}</li>`).join('')}</ul><p class="small">Du kan starte sådan: Først fandt jeg … fordi … Jeg tjekkede det ved at …</p></section>
<section id="s-kan">${H(7)}<p>Sæt et hak, når du synes, du kan det.</p><ul class="kan">${c.maal.map((m,n)=>`<li><label for="k${n}"><input type="checkbox" id="k${n}"${k[n]?' checked':''}><span>${m}</span></label></li>`).join('')}</ul></section>
<nav class="pn" aria-label="Forrige og næste kapitel">${pv?`<a style="${hue(pv.id)}" href="#${pv.id}"><span>${IC.l}Forrige</span><b>${pv.t}</b></a>`:`<a href="#hjem"><span>${IC.l}Tilbage</span><b>Alle kapitler</b></a>`}${nx?`<a style="${hue(nx.id)}" href="#${nx.id}"><span>Næste${IC.r}</span><b>${nx.t}</b></a>`:`<a style="--c:var(--fg);--on:#fff" href="#hjem"><span>Færdig${IC.r}</span><b>Alle kapitler</b></a>`}</nav>
</div></div>`;
  const sb=[...app.querySelectorAll('[data-go]')];
  sb.forEach(b=>b.onclick=()=>$(b.dataset.go).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}));
  if(spy)spy.disconnect();
  if('IntersectionObserver' in window){spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)sb.forEach(b=>b.setAttribute('aria-current',b.dataset.go==e.target.id))}),{rootMargin:'-15% 0px -70% 0px'});STEPS.forEach(([d])=>spy.observe($(d)))}
  app.querySelectorAll('.kan input').forEach((b,n)=>b.onchange=()=>{(kan[c.id]=kan[c.id]||[])[n]=b.checked;try{localStorage.setItem('mv6kan',JSON.stringify(kan))}catch(e){}});
  TOOLS[c.id]($('tool'));practice(c)}
const route=()=>{const c=CH.find(c=>c.id==location.hash.slice(1));c?chapter(c):home();window.scrollTo(0,0)};
window.addEventListener('hashchange',route);route();
}
</script>
