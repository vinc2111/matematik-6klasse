/* Layout: plakat og lærebog. Hvert kapitel har sin egen farve og en geometrisk forside; resten er sort tekst på lyst papir med tydelige streger. Kun lyst tema. */
:root{
  --bg:#f6f5f1; --panel:#ffffff; --surface:#ffffff; --fg:#15171c; --muted:#5d6270; --line:#dcd9d0;
  --ink:#2447d6; --on-ink:#ffffff; --soft:#dfe6fb; --m2:#0f8a6a; --m3:#e5432d;
  --ok:#157a47; --ok-soft:#dff3e6; --bad-soft:#fde7e1; --hint-soft:#fff1cc;
  --c:#15171c; --on:#ffffff; --k:#15171c;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:5px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.65;padding-block:28px 140px;padding-left:max(clamp(20px,4.5vw,56px),env(safe-area-inset-left,0px));padding-right:max(clamp(20px,4.5vw,56px),env(safe-area-inset-right,0px));font-variant-numeric:tabular-nums lining-nums}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,.q,.no,.step,.fejl,.num{font-family:var(--display);font-optical-sizing:auto}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-weight:800;letter-spacing:-.03em;line-height:.95}
h2{font-size:1.75rem;font-weight:700;letter-spacing:-.015em;line-height:1.15;margin-bottom:26px;display:flex;align-items:baseline;gap:.55em}
h3{font-size:1.05rem;margin:38px 0 12px}
p{margin:0 0 16px;max-width:60ch;text-wrap:pretty}
ul,ol{margin:0 0 16px;padding-left:1.25em;max-width:60ch}
li{margin-bottom:11px}
a{color:var(--fg)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.small{font-size:.95rem;color:var(--muted)}
.ic{width:1.05em;height:1.05em;flex:none;vertical-align:-.15em}
.step{font-weight:800;color:var(--k)}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-bottom:30px}
.brand{font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:-.01em;color:var(--fg);text-decoration:none}
#nav{color:var(--muted)}
#nav a{display:inline-flex;align-items:center;gap:8px;font-weight:600;text-decoration:none;border-bottom:2px solid var(--fg);padding-bottom:1px}

/* forside */
.hero h1{font-size:clamp(2.5rem,10.6vw,7.2rem);margin-top:44px}
.intro{display:flex;flex-wrap:wrap;gap:22px 56px;justify-content:space-between;align-items:flex-end;margin-top:26px}
.lead{font-size:1.3rem;line-height:1.45;max-width:34ch;margin:0}
.stat{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
.stat .num{font-weight:800;font-size:4rem;line-height:.9;letter-spacing:-.03em}
.stat .lbl{font-size:1rem;line-height:1.3;color:var(--muted)}
.block{margin-top:112px;padding-top:36px;border-top:2px solid var(--fg)}
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:60px 30px;list-style:none;padding:0;margin:16px 0 0;max-width:none}
.shelf li{margin:0}
@media (max-width:900px){.shelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:44px 18px}}
.cover{display:flex;flex-direction:column;gap:8px;color:var(--fg);text-decoration:none}
.art{position:relative;overflow:hidden;background:var(--c);color:var(--on)}
.art svg{position:absolute;inset:0;width:100%;height:100%;display:block}

.flist{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.flist button{font:inherit;font-size:.98rem;font-weight:600;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:7px 13px;min-height:42px;color:var(--fg);cursor:pointer}
.flist button:hover{border-color:var(--fg)}
.flist button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on)}
.tfilm{margin-top:14px;padding-top:16px;border-top:1px solid var(--line)}
.tfilm .fcap{font-size:1.1rem;min-height:0}

.teori{margin-top:30px;border-bottom:1px solid var(--line)}
.teori article{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:8px 40px;padding:34px 0;border-top:1px solid var(--line)}
.teori h3{font-family:var(--display);font-size:1.3rem;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin:0}
.teori p:last-child{margin-bottom:0}
.formel{font-family:var(--display);font-size:1.55rem;font-weight:700;line-height:1.25;letter-spacing:-.01em;color:var(--k);margin-bottom:14px}
.fx{color:var(--muted)}
.fx span{font-weight:700;color:var(--k);margin-right:.7em}
@media (max-width:640px){.teori article{grid-template-columns:minmax(0,1fr);gap:10px;padding:28px 0}}
.husk{margin:6px 0 4px}
.husk ul{list-style:none;padding:20px 24px;margin:14px 0 0;max-width:none;background:color-mix(in srgb,var(--c) 10%,var(--panel));border-radius:var(--r)}
.husk li:last-child{margin-bottom:0}
@media (max-width:560px){.work,.fast{padding:20px}.tool{padding:16px}.bt{padding:150px 22px 26px}.daily{padding:22px}.cont .ct{padding:22px}.eks{padding:22px 20px 22px}.fejl{padding:22px}.main section{margin-top:80px}.block{margin-top:84px}}

.teori .fkw{margin-top:18px}
.fkw .btn.fkb{min-height:42px;padding:6px 16px;font-weight:600}
.teori .tfilm,.eksbar+.fkw .tfilm,details .tfilm{border-top:0;padding-top:4px;margin-top:10px}
.eksbar+.fkw{margin-top:14px}
details .fkw{margin-top:18px}

.trin5{list-style:none;display:flex;flex-wrap:wrap;gap:6px 20px;padding:0;margin:0 0 24px;max-width:none;counter-reset:t;font-size:.95rem;color:var(--muted)}
.trin5 li{margin:0;counter-increment:t}
.trin5 li::before{content:counter(t);font-family:var(--display);font-weight:800;color:var(--k);margin-right:.45em}
.tjek{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.tjek .sv{margin-left:.3em}
.fst{width:42px;height:42px;flex:none;border:2px solid var(--fg);border-radius:var(--r);background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.fctl{gap:8px 10px}
.fctl input{margin-left:6px}
.side .grp{font-size:.82rem;font-weight:700;color:var(--muted);margin:26px 0 8px}
.side .grp:first-child{margin-top:0}
.side ol button .chk{margin-left:auto;display:none;color:var(--ok)}
.side ol button.set .chk{display:inline-flex}
.stepnav{align-items:center}
@media (max-width:940px){.side .grp{display:none}.side ol button .chk{margin-left:2px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="brand" href="#hjem">Matematikværksted</a><span id="nav"></span></header>
  <main id="app"></main>
</div>

<script>
let rnd=Math.random;const R=(a,b)=>Math.floor(rnd()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const f=n=>{n=Math.round(n*100)/100;return (n<0?'−':'')+Math.abs(n).toLocaleString('da-DK',{maximumFractionDigits:2,useGrouping:false})};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const T=(q,a,unit,hint,sol,tol)=>({q,a,unit,hint,sol,tol});
function parse(s){s=s.trim().replace(/\s/g,'').replace(/[−–]/g,'-').replace(/^[a-zæøå]=/i,'').replace(/[^\d]+$/,'');if(s.includes(',')||/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'').replace(',','.');return /^-?\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN}
const PI='Brug π ≈ 3,14.';

/* ---------- Opgaver: tre niveauer pr. kapitel ---------- */
const K={};
K.tal=[[
 ()=>{const a=R(2,9),b=R(2,6),c=R(2,6);return T(`Udregn ${a} + ${b} · ${c}`,a+b*c,'','Gange kommer før plus.',`${b} · ${c} = ${b*c}. Derefter ${a} + ${b*c} = ${a+b*c}.`)},
 ()=>{const a=R(1,8),b=a+R(1,9);return T(`Udregn ${a} − ${b}`,a-b,'',`Tegn en tallinje. Start på ${a}, og hop ${b} til venstre.`,`Fra ${a} er der ${a} hop ned til 0. Så mangler der ${b-a} hop. Du lander på ${f(a-b)}.`)},
 ()=>{const a=R(26,40),b=R(2,5),c=R(2,5);return T(`Udregn ${a} − ${b} · ${c}`,a-b*c,'','Gange kommer før minus.',`${b} · ${c} = ${b*c}. Derefter ${a} − ${b*c} = ${a-b*c}.`)}
],[
 ()=>{const a=R(2,8),b=R(2,8),c=R(2,5),d=R(1,9);return T(`Udregn (${a} + ${b}) · ${c} − ${d}`,(a+b)*c-d,'','Start med parentesen.',`Parentesen først: ${a} + ${b} = ${a+b}. Så gange: ${a+b} · ${c} = ${(a+b)*c}. Til sidst: ${(a+b)*c} − ${d} = ${(a+b)*c-d}.`)},
 ()=>{const a=R(3,12),b=R(1,15);return T(`Udregn −${a} + ${b}`,b-a,'',`Start på −${a} på tallinjen, og hop ${b} til højre.`,`Du starter på −${a} og hopper ${b} til højre. Du lander på ${f(b-a)}.`)},
 ()=>{const a=R(2,12),b=R(2,12);return T(`Udregn −${a} − ${b}`,-a-b,'',`Start på −${a} på tallinjen, og hop ${b} til venstre.`,`Du starter på −${a} og hopper ${b} til venstre. Du lander på ${f(-a-b)}.`)},
 ()=>{const a=R(2,5);return T(`Udregn ${a}³`,a**3,'',`${a}³ betyder ${a} · ${a} · ${a}.`,`${a} · ${a} = ${a*a}, og ${a*a} · ${a} = ${a**3}.`)}
],[
 ()=>{const n=R(3,6),k=R(2,8);return T(`Saft blandes i forholdet 1:${n} (saft til vand). Du bruger ${k} dL saft. Hvor mange dL vand skal du bruge?`,k*n,'dL',`For hver 1 dL saft skal der ${n} dL vand til.`,`${k} · ${n} = ${k*n} dL vand.`)},
 ()=>{const [p,d]=pick([[2,3],[3,4],[1,2],[3,5],[4,5]]),m=R(2,4);return T(`I en klasse er forholdet mellem piger og drenge ${p}:${d}. Der er ${(p+d)*m} elever. Hvor mange piger er der?`,p*m,'piger','Find først, hvor mange dele der er i alt.',`Der er ${p} + ${d} = ${p+d} dele. Hver del er ${(p+d)*m} : ${p+d} = ${m} elever. Pigerne er ${p} dele: ${p} · ${m} = ${p*m}.`)},
 ()=>{const a=R(5,20),b=R(2,5),c=R(3,6),d=R(2,5);return T(`Udregn ${a} − ${b} · ${c} + ${d}²`,a-b*c+d*d,'','Potens først, så gange, til sidst plus og minus fra venstre mod højre.',`${d}² = ${d*d}, og ${b} · ${c} = ${b*c}. Derefter ${a} − ${b*c} + ${d*d} = ${f(a-b*c+d*d)}.`)}
]];
K.cirkler=[[
 ()=>{const r=R(2,15);return T(`En cirkel har radius ${r} cm. Hvad er diameteren?`,2*r,'cm','Diameteren er dobbelt så lang som radius.',`d = 2 · ${r} = ${2*r} cm.`)},
 ()=>{const r=R(2,15);return T(`En cirkel har diameter ${2*r} cm. Hvad er radius?`,r,'cm','Radius er halvdelen af diameteren.',`r = ${2*r} : 2 = ${r} cm.`)},
 ()=>{const d=R(2,20);return T(`En cirkel har diameter ${d} cm. Hvad er omkredsen? ${PI}`,3.14*d,'cm','O = π · d.',`O ≈ 3,14 · ${d} = ${f(3.14*d)} cm.`,3.14*d*.01)}
],[
 ()=>{const r=R(2,12);return T(`En cirkel har radius ${r} cm. Hvad er omkredsen? ${PI}`,6.28*r,'cm','Find diameteren først.',`d = 2 · ${r} = ${2*r} cm. O ≈ 3,14 · ${2*r} = ${f(6.28*r)} cm.`,6.28*r*.01)},
 ()=>{const r=R(2,10);return T(`En cirkel har radius ${r} cm. Hvad er arealet? ${PI}`,3.14*r*r,'cm²','A = π · r · r.',`A ≈ 3,14 · ${r} · ${r} = 3,14 · ${r*r} = ${f(3.14*r*r)} cm².`,3.14*r*r*.01)}
],[
 ()=>{const d=R(5,30);return T(`En cirkel har omkredsen ${f(3.14*d)} cm. Hvad er diameteren? ${PI}`,d,'cm','O = π · d. Hvad skal du gøre for at finde d?',`d = O : π ≈ ${f(3.14*d)} : 3,14 = ${d} cm.`,d*.01)},
 ()=>{const d=pick([50,60,70]),n=pick([10,20,100]);return T(`Et hjul har diameteren ${d} cm. Hvor mange meter ruller det på ${n} omgange? ${PI}`,3.14*d*n/100,'m','Én omgang er lige så lang som hjulets omkreds. Husk at lave cm om til m.',`Omkreds: 3,14 · ${d} = ${f(3.14*d)} cm. ${n} omgange: ${f(3.14*d*n)} cm = ${f(3.14*d*n/100)} m.`,3.14*d*n/100*.01)},
 ()=>{const r=2*R(1,5);return T(`En halvcirkel har radius ${r} cm. Hvad er arealet? ${PI}`,3.14*r*r/2,'cm²','Find arealet af hele cirklen, og halver det.',`Hel cirkel: 3,14 · ${r} · ${r} = ${f(3.14*r*r)} cm². Halvdelen er ${f(3.14*r*r/2)} cm².`,3.14*r*r/2*.01)}
]];
K.handel=[[
 ()=>{const p=pick([10,25,50]),N=40*R(2,20);return T(`Hvad er ${p} % af ${N} kr.?`,N*p/100,'kr.',{10:'10 % er en tiendedel. Divider med 10.',25:'25 % er en fjerdedel. Divider med 4.',50:'50 % er halvdelen.'}[p],`${N} : ${100/p} = ${f(N*p/100)} kr.`)},
 ()=>{const [a,b,p]=pick([[1,2,50],[1,4,25],[3,4,75],[1,5,20],[2,5,40],[1,10,10],[3,10,30]]);return T(`Hvor mange procent er ${a}/${b}?`,p,'%','Forlæng brøken, så nævneren bliver 100.',`${a}/${b} = ${p}/100 = ${p} %.`)}
],[
 ()=>{const p=pick([10,20,25,30,40]),N=20*R(5,40);return T(`En trøje koster ${N} kr. Der er ${p} % rabat. Hvad koster trøjen nu?`,N-N*p/100,'kr.','Find først rabatten i kroner. Start med 10 % eller 25 %.',`Rabatten er ${p} % af ${N} kr. = ${f(N*p/100)} kr. Ny pris: ${N} − ${f(N*p/100)} = ${f(N-N*p/100)} kr.`)},
 ()=>{const p=pick([15,35,60,75]),N=20*R(2,30);return T(`Hvad er ${p} % af ${N} kr.?`,N*p/100,'kr.','Del procenten op, fx i 10 % og 5 %, eller i 50 % og 25 %.',`1 % af ${N} kr. er ${f(N/100)} kr. ${p} · ${f(N/100)} = ${f(N*p/100)} kr.`)}
],[
 ()=>{const N=20*R(2,40);return T(`En vare koster ${N} kr. uden moms. Momsen er 25 %. Hvad er prisen med moms?`,1.25*N,'kr.','Find 25 % af prisen, og læg den til.',`Moms: ${N} : 4 = ${f(N/4)} kr. Pris med moms: ${N} + ${f(N/4)} = ${f(1.25*N)} kr.`)},
 ()=>{const p=pick([20,25,50]),N=100*R(2,12),S=N*(100-p)/100;return T(`En jakke koster ${S} kr. efter ${p} % rabat. Hvad kostede den før rabatten?`,N,'kr.',`Efter ${p} % rabat betaler du ${100-p} % af prisen.`,`${S} kr. er ${100-p} % af prisen. 1 % er ${S} : ${100-p} = ${f(S/(100-p))} kr. Hele prisen er 100 · ${f(S/(100-p))} = ${N} kr.`)},
 ()=>{const [a,b,p]=pick([[12,48,25],[15,60,25],[9,45,20],[18,24,75],[14,35,40],[27,90,30],[33,55,60]]);return T(`${a} ud af ${b} elever cykler i skole. Hvor mange procent er det?`,p,'%','Skriv det som en brøk, og forkort den.',`${a}/${b} = ${a/gcd(a,b)}/${b/gcd(a,b)} = ${p}/100 = ${p} %.`)}
]];
K.figurer=[[
 ()=>{const l=R(3,12),b=R(2,9);return T(`Et rektangel er ${l} cm langt og ${b} cm bredt. Hvad er arealet?`,l*b,'cm²','Areal af et rektangel er længde gange bredde.',`${l} · ${b} = ${l*b} cm².`)},
 ()=>{const g=2*R(2,8),h=R(3,10);return T(`En trekant har grundlinje ${g} cm og højde ${h} cm. Hvad er arealet?`,g*h/2,'cm²','A = ½ · g · h.',`½ · ${g} · ${h} = ½ · ${g*h} = ${g*h/2} cm².`)},
 ()=>{const a=R(30,80),b=R(30,80);return T(`To vinkler i en trekant er ${a}° og ${b}°. Hvor stor er den tredje vinkel?`,180-a-b,'°','Vinkelsummen i en trekant er 180°.',`${a} + ${b} = ${a+b}. Den tredje vinkel er 180 − ${a+b} = ${180-a-b}°.`)}
],[
 ()=>{const g=R(4,14),h=R(3,9);return T(`Et parallelogram har grundlinje ${g} cm og højde ${h} cm. Hvad er arealet?`,g*h,'cm²','Et parallelogram kan klippes om til et rektangel med samme grundlinje og højde.',`A = g · h = ${g} · ${h} = ${g*h} cm².`)},
 ()=>{const a=R(70,110),b=R(70,110),c=R(60,100);return T(`Tre vinkler i en firkant er ${a}°, ${b}° og ${c}°. Hvor stor er den fjerde vinkel?`,360-a-b-c,'°','En firkant kan deles i to trekanter. Hvad er vinkelsummen så?',`Vinkelsummen er 2 · 180 = 360°. ${a} + ${b} + ${c} = ${a+b+c}. Den fjerde vinkel er 360 − ${a+b+c} = ${360-a-b-c}°.`)},
 ()=>{const t=2*R(10,60);return T(`En ligebenet trekant har en topvinkel på ${t}°. Hvor stor er hver af de to andre vinkler?`,(180-t)/2,'°','De to vinkler ved grundlinjen er lige store.',`180 − ${t} = ${180-t}. De to vinkler deler resten: ${180-t} : 2 = ${(180-t)/2}°.`)}
],[
 ()=>{const a=R(3,9),b=a+2*R(1,4),h=R(2,8);return T(`Et trapez har de parallelle sider ${a} cm og ${b} cm. Højden er ${h} cm. Hvad er arealet?`,(a+b)/2*h,'cm²','A = ½ · (a + b) · h.',`${a} + ${b} = ${a+b}. Halvdelen er ${(a+b)/2}. ${(a+b)/2} · ${h} = ${(a+b)/2*h} cm².`)},
 ()=>{const n=pick([5,6,8,10]);return T(`Hvad er vinkelsummen i en ${n}-kant?`,(n-2)*180,'°',`En ${n}-kant kan deles i ${n-2} trekanter fra ét hjørne.`,`${n-2} trekanter med 180° i hver: ${n-2} · 180 = ${(n-2)*180}°.`)},
 ()=>{const g=R(4,12),h=R(3,10);return T(`En trekant har arealet ${f(g*h/2)} cm² og grundlinjen ${g} cm. Hvad er højden?`,h,'cm','Gang arealet med 2. Så har du g · h.',`2 · ${f(g*h/2)} = ${g*h}. h = ${g*h} : ${g} = ${h} cm.`)}
]];
K.data=[[
 ()=>{const a=[R(2,12),R(2,12),R(2,12)];let x=R(2,9);const s=a[0]+a[1]+a[2];x+=(4-(s+x)%4)%4;a.push(x);const l=shuf(a);return T(`Find middeltallet af tallene ${l.join(', ')}.`,(s+x)/4,'','Læg tallene sammen, og divider med antallet af tal.',`${l.join(' + ')} = ${s+x}. ${s+x} : 4 = ${(s+x)/4}.`)},
 ()=>{const p=shuf([1,2,3,4,5,6,7,8,9]),l=shuf([p[0],p[0],p[0],p[1],p[2],p[3],p[4]]);return T(`Find typetallet: ${l.join(', ')}.`,p[0],'','Typetallet er det tal, der er flest af.',`${p[0]} forekommer 3 gange. Det er flere end de andre tal.`)},
 ()=>{const l=Array.from({length:6},()=>R(1,30)),mx=Math.max(...l),mn=Math.min(...l);return T(`Find variationsbredden: ${l.join(', ')}.`,mx-mn,'','Find det største og det mindste tal.',`Største tal er ${mx}, mindste tal er ${mn}. ${mx} − ${mn} = ${mx-mn}.`)}
],[
 ()=>{const l=shuf(Array.from({length:30},(_, i)=>i+1)).slice(0,pick([5,7])),s=[...l].sort((a,b)=>a-b);return T(`Find medianen: ${l.join(', ')}.`,s[(s.length-1)/2],'','Stil tallene i rækkefølge først.',`I rækkefølge: ${s.join(', ')}. Det midterste tal er ${s[(s.length-1)/2]}.`)},
 ()=>{const l=shuf(Array.from({length:20},(_, i)=>i+1)).slice(0,6),s=[...l].sort((a,b)=>a-b);return T(`Find medianen: ${l.join(', ')}.`,(s[2]+s[3])/2,'','Der er to tal i midten. Medianen ligger midt mellem dem.',`I rækkefølge: ${s.join(', ')}. De to midterste er ${s[2]} og ${s[3]}. Midt imellem ligger ${f((s[2]+s[3])/2)}.`)},
 ()=>{const t=pick([4,5,10,20,25]),r=R(1,t-1);return T(`I en pose er der ${r} røde og ${t-r} blå kugler. Du trækker én kugle uden at kigge. Hvad er sandsynligheden for rød? Svar i procent.`,r/t*100,'%','Gunstige udfald divideret med mulige udfald.',`${r} røde ud af ${t} kugler: ${r}/${t} = ${f(r/t*100)}/100 = ${f(r/t*100)} %.`)}
],[
 ()=>{const a=Array.from({length:4},()=>R(3,15));let x=R(3,11);const s=a.reduce((p,c)=>p+c,0);x+=(5-(s+x)%5)%5;const m=(s+x)/5;return T(`Middeltallet af fem tal er ${m}. Fire af tallene er ${a.join(', ')}. Hvad er det femte tal?`,x,'','Hvad skal summen af alle fem tal være?',`Summen skal være 5 · ${m} = ${5*m}. De fire tal giver ${s}. Det femte tal er ${5*m} − ${s} = ${x}.`)},
 ()=>{const s=R(2,12),w=6-Math.abs(s-7);return T(`Du slår med to terninger. Hvor mange af de 36 mulige udfald giver summen ${s}?`,w,'udfald','Skriv alle par op, fx 1 + 6 og 6 + 1. De tæller som to forskellige udfald.',`Der er ${w} udfald med summen ${s}. Sandsynligheden er ${w}/36.`)}
]];
K.algebra=[[
 ()=>{const k=R(2,6),c=R(1,9),v=R(2,8);return T(`Hvad er ${k} · a + ${c}, når a = ${v}?`,k*v+c,'','Sæt tallet ind i stedet for a.',`${k} · ${v} + ${c} = ${k*v} + ${c} = ${k*v+c}.`)},
 ()=>{const x=R(2,20),a=R(2,15);return T(`Løs ligningen x + ${a} = ${x+a}`,x,'',`Træk ${a} fra på begge sider.`,`x = ${x+a} − ${a} = ${x}. Tjek: ${x} + ${a} = ${x+a}.`)},
 ()=>{const x=R(5,25),a=R(2,x-1);return T(`Løs ligningen x − ${a} = ${x-a}`,x,'',`Læg ${a} til på begge sider.`,`x = ${x-a} + ${a} = ${x}. Tjek: ${x} − ${a} = ${x-a}.`)}
],[
 ()=>{const a=R(2,6),x=R(2,9),b=R(1,12);return T(`Løs ligningen ${a}x + ${b} = ${a*x+b}`,x,'',`Træk først ${b} fra på begge sider.`,`${a}x = ${a*x+b} − ${b} = ${a*x}. x = ${a*x} : ${a} = ${x}. Tjek: ${a} · ${x} + ${b} = ${a*x+b}.`)},
 ()=>{const p=R(2,6),q=R(2,6);return T(`Reducer ${p}a + ${q}a + a. Hvilket tal står foran a?`,p+q+1,'','a alene er det samme som 1a.',`${p} + ${q} + 1 = ${p+q+1}. Udtrykket bliver ${p+q+1}a.`)}
],[
 ()=>{const c=R(1,3),a=c+R(1,4),x=R(1,9),b=R(1,10),d=(a-c)*x+b,cx=c>1?c+'x':'x';return T(`Løs ligningen ${a}x + ${b} = ${cx} + ${d}`,x,'',`Træk ${cx} fra på begge sider, så x kun står på den ene side.`,`${a-c>1?a-c:''}x + ${b} = ${d}. ${a-c>1?a-c:''}x = ${d-b}. x = ${x}. Tjek: ${a} · ${x} + ${b} = ${a*x+b}, og ${c} · ${x} + ${d} = ${c*x+d}.`)},
 ()=>{const a=R(2,6),x=R(2,12),b=R(1,15);return T(`Jeg tænker på et tal. Jeg ganger det med ${a} og lægger ${b} til. Resultatet er ${a*x+b}. Hvilket tal tænker jeg på?`,x,'',`Skriv det som en ligning: ${a}x + ${b} = ${a*x+b}.`,`${a}x = ${a*x+b} − ${b} = ${a*x}. x = ${a*x} : ${a} = ${x}.`)},
 ()=>{const x=R(2,10),k=R(1,6);return T(`Et rektangel har længden x + ${k} og bredden x. Omkredsen er ${4*x+2*k}. Hvad er x?`,x,'','Omkredsen er to længder og to bredder. Skriv et udtryk.',`Omkreds: 2 · (x + ${k}) + 2 · x = 4x + ${2*k}. 4x + ${2*k} = ${4*x+2*k}, så 4x = ${4*x} og x = ${x}.`)}
]];
K.rum=[[

const sl=(id,lab,min,max,v,step=1)=>`<label class="sl" for="${id}"><span>${lab}: <b id="${id}-o"></b></span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${v}"></label>`;
const pts=a=>a.map(p=>p.map(v=>Math.round(v*10)/10).join(',')).join(' ');

function mount(root,vb,ctl,draw){
  root.innerHTML=`<div class="tool"><div class="fig"><svg id="fig" viewBox="${vb}" role="img" aria-label="Interaktiv model. Tallene står i teksten ved siden af."></svg></div><div class="ctl"><div class="ctls" id="ctls">${ctl}</div><div class="read" id="read"></div></div></div>`;
  const go=()=>{root.querySelectorAll('input[type=range]').forEach(i=>{const o=$(i.id+'-o');if(o)o.textContent=f(+i.value)});const r=draw();$('fig').innerHTML=r[0];$('read').innerHTML=r[1]};
  $('ctls').addEventListener('input',go);go();return go;
}

const TOOLS={

const EKS={

<section id="s-eks">${H('s-eks')}<div class="eks" id="eks"></div><p class="row eksbar"><button type="button" class="btn" id="eksn">Vis næste trin</button><button type="button" class="link" id="eksa">Vis alle trin</button><button type="button" class="btn ghost" id="nyeks">${IC.ny}Nyt eksempel med andre tal</button></p>${fk(c.id,[EKSF[c.id]||0])}</section>
<section id="s-fejl">${H('s-fejl')}<p class="fejl">${c.fejl[0]}</p><p>Hvad er gået galt? Snak med din makker, før du kigger.</p><details><summary>Se forklaringen</summary><p>${c.fejl[1]}</p>${fk(c.id,[FEJLF[c.id]||0])}</details></section>
<section id="s-opg">${H('s-opg')}<p>Regn i dit hæfte, og skriv svaret her.</p><details class="husk"><summary>Huskeseddel</summary><ul>${TEORI[c.id].map(x=>`<li><b>${x[0]}:</b> ${x[1]?x[1]+'. ':''}Fx ${x[3]}</li>`).join('')}</ul></details><div class="work"><div class="tabs" id="lvs"></div><p class="q" id="q"></p><ol class="trin5" id="tip" hidden><li>Læs opgaven to gange.</li><li>Hvad ved du?</li><li>Hvad skal du finde?</li><li>Skriv et regnestykke.</li><li>Regn, og tjek svaret.</li></ol><form class="row" id="pf" autocomplete="off"><label for="ans">Svar</label><input class="ans" id="ans" inputmode="text" autocomplete="off"><span id="unit"></span><button class="btn" id="chk">Tjek svar</button></form><div class="fkw"><p class="row"><button type="button" class="btn ghost" id="hnt">Hint</button><button type="button" class="btn ghost" id="nxt">Ny opgave</button><button type="button" class="btn ghost fkb" id="tfb" data-fi="0" hidden></button><button type="button" class="btn ghost fkb" id="tfg" data-fi="-1" hidden>${IC.pl}Film: Problemopgaver</button></p><div class="film tfilm" id="tfilm" hidden></div></div><p class="fb" id="fb" role="status" hidden></p><p class="small" id="dots"></p></div></section>
<section id="s-fart">${H('s-fart')}<p>Du har ${FAST} sekunder. Vælg det rigtige svar så hurtigt, du kan. Det er en leg og tæller ikke med i dine 20 opgaver.</p><div class="fast" id="fast"></div></section>
<section id="s-fork">${H('s-fork')}<ul>${c.forklar.map(s=>`<li>${s}</li>`).join('')}</ul><p class="small">Du kan starte sådan: Først fandt jeg … fordi … Jeg tjekkede det ved at …</p><p class="small">Er du alene, så skriv din forklaring i hæftet.</p></section>
<section id="s-kan">${H('s-kan')}<p>Sæt et hak, når du synes, du kan det.</p><ul class="kan">${c.maal.map((m,n)=>`<li><label for="k${n}"><input type="checkbox" id="k${n}"${k[n]?' checked':''}><span>${m}</span></label></li>`).join('')}</ul></section>
<div class="stepnav"><button type="button" class="btn ghost" id="sprev"></button><span class="small" id="spos"></span><button type="button" class="btn" id="snext"></button></div>
<nav class="pn" aria-label="Forrige og næste kapitel">${pv?`<a data-ch style="${hue(pv.id)}" href="#${pv.id}"><span>${IC.l}Forrige</span><b>${pv.t}</b></a>`:`<a href="#hjem"><span>${IC.l}Tilbage</span><b>Alle kapitler</b></a>`}${nx?`<a data-ch style="${hue(nx.id)}" href="#${nx.id}"><span>Næste${IC.r}</span><b>${nx.t}</b></a>`:`<a style="--c:var(--fg);--on:#fff" href="#hjem"><span>Færdig${IC.r}</span><b>Alle kapitler</b></a>`}</nav>
</div></div>`;
  app.querySelectorAll('.fkw').forEach(w=>{const box=w.querySelector('.tfilm');let pl=null,cur=null;w.querySelectorAll('.fkb').forEach(b=>b.onclick=()=>{const fi=+b.dataset.fi;if(!box.hidden&&cur==fi){if(pl)pl.stop();box.hidden=true;return}if(pl)pl.stop();box.hidden=false;const F=fi<0?GEN:FILMS[c.id][fi];pl=player(box,F,F.t);cur=fi;pl.play()})});

  app.querySelectorAll('.kan input').forEach((b,n)=>b.onchange=()=>{(kan[c.id]=kan[c.id]||[])[n]=b.checked;put('mv6kan',kan)});
  TOOLS[c.id]($('tool'));practice(c);film(c);hurtig(c);eksVis();vis()}
